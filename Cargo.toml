[package]
name = "agent-knowledge"
version = "0.0.0"
edition = "2024"
description = "Operational memory for code repositories, shared between machines through Git and served to agents over MCP."
readme = "README.md"
publish = false

[[bin]]
name = "agent-knowledge"
path = "src/main.rs"

[lib]
name = "agent_knowledge"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
uuid = { version = "1.18.1", features = ["v4"] }

[lints.rust]
# D-010: the domain and persistence core stays in safe Rust. Unsafe is allowed only
# in a small, justified, tested FFI boundary, and only by opting in explicitly there.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
